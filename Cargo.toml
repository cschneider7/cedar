[package]
name = "class_management"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-sdk-s3 = "1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clerk-rs = { version = "0.4.2", features = ["axum"] }
dotenv = "0.15.0"
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-native-tls", "postgres", "chrono", "uuid"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
