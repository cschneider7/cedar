[package]
name = "class_management"
version = "0.2.0"
edition = "2024"

[dependencies]
aws-sdk-s3 = "1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-postgres = "0.14"
dotenv = "0.15.0"
jsonwebtoken = "11"
postgres-from-row = "0.5"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
tracing = "0.1.44"
tower = "0.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2"
uuid = { version = "1.23.4", features = ["serde", "v4"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
anyhow = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Local-dev/Fly-shaped entrypoint (unchanged behavior).
[[bin]]
name = "class_management"
path = "src/main.rs"

# Vercel Functions entrypoint.
[[bin]]
name = "index"
path = "api/index.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
