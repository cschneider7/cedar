[package]
name = "class_management"
version = "0.2.0-beta.2"
edition = "2024"

[dependencies]
aws-sdk-s3 = "1"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
jsonwebtoken = "9"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
tracing = "0.1.44"
tower = "0.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }
vercel_runtime = { version = "2.4", features = ["axum"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# Local-dev/Fly-shaped entrypoint (unchanged behavior).
[[bin]]
name = "class_management"
path = "src/main.rs"

# Vercel Functions entrypoint.
[[bin]]
name = "index"
path = "api/index.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
