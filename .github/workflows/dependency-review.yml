name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Scan Dependency Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # rustls-webpki DoS via malformed CRL, pulled in transitively by
          # aws-sdk-s3 -> aws-smithy-http-client's hyper-rustls "acceptor"
          # feature (server-side TLS code we never exercise as an S3 client).
          # No newer aws-sdk-s3 release avoids this as of 1.141.0 (latest).
          allow-ghsas: GHSA-82j2-j2ch-gfr8
