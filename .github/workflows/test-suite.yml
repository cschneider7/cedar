name: Test Suite

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run tests
        run: cargo test --all-features

  node-tests:
    name: Node Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 26.x
        uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          VITE_API_URL: "http://localhost:3001/api/v1"

  test-suite:
    name: test-suite
    runs-on: ubuntu-latest
    needs: [rust-tests, node-tests]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Verify required jobs succeeded
        run: |
          echo "rust-tests: ${{ needs.rust-tests.result }}"
          echo "node-tests: ${{ needs.node-tests.result }}"
          if [ "${{ needs.rust-tests.result }}" != "success" ] || [ "${{ needs.node-tests.result }}" != "success" ]; then
            echo "::error::One or more required jobs did not succeed."
            exit 1
          fi
          echo "All required jobs succeeded."
