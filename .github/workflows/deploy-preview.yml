name: Deploy Preview Environment

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  create_neon_branch:
    name: Create Neon Branch
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}
      - name: Cache sqlx-cli
        id: cache-sqlx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: sqlx-cli-${{ runner.os }}-0.9.0
      - name: Install sqlx-cli
        if: steps.cache-sqlx-cli.outputs.cache-hit != 'true'
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features postgres,rustls --locked
      - name: Run Migrations
        run: sqlx migrate run
        env:
          DATABASE_URL: "${{ steps.create_neon_branch.outputs.db_url }}"
      - name: Post Schema Diff Comment to PR
        uses: neondatabase/schema-diff-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          compare_branch: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

  deploy_fly_preview:
    name: Deploy Fly Preview App
    needs: create_neon_branch
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    environment:
      name: pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # Org-scoped token: creating a new review app needs org permissions,
      # unlike the app-scoped FLY_API_TOKEN used for prod deploys in rust.yml.
      FLY_API_TOKEN: ${{ secrets.FLY_ORG_API_TOKEN }}
      FLY_REGION: sjc
      FLY_ORG: personal
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Get Neon branch connection string
        id: neon_conn
        # Job-level outputs get silently dropped when they contain a value
        # GitHub has masked as a secret (create-branch-action masks db_url) -
        # fetch it fresh here instead of via `needs.create_neon_branch.outputs`.
        run: |
          conn=$(npx -y neonctl@latest connection-string \
            "preview/pr-${{ github.event.number }}-${{ github.head_ref }}" \
            --project-id ${{ vars.NEON_PROJECT_ID }} \
            --api-key ${{ secrets.NEON_API_KEY }} \
            --pooled false)
          echo "::add-mask::$conn"
          echo "db_url=$conn" >> "$GITHUB_OUTPUT"
      - name: Deploy review app
        id: deploy
        uses: superfly/fly-pr-review-apps@1.5.0
        with:
          name: pr-${{ github.event.number }}-seating-chart-app
          config: fly.toml
          secrets: >-
            DATABASE_URL=${{ steps.neon_conn.outputs.db_url }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
      - name: Smoke test preview app
        run: |
          url="${{ steps.deploy.outputs.url }}/health"
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              echo "Preview app is healthy."
              exit 0
            fi
            sleep 6
          done
          echo "Preview app did not become healthy after retries (last status: $status)."
          exit 1

  delete_neon_branch:
    name: Delete Neon Branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

  destroy_fly_preview:
    name: Destroy Fly Preview App
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_ORG_API_TOKEN }}
      FLY_REGION: sjc
      FLY_ORG: personal
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # Same action as the deploy job - it destroys the app itself when it
      # sees a 'closed' PR action, instead of a separate manual flyctl call.
      - uses: superfly/fly-pr-review-apps@1.5.0
        with:
          name: pr-${{ github.event.number }}-seating-chart-app
          config: fly.toml
