# Docker Compose file for local development of the Cedar project
name: cedar

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-dev
    container_name: cedar-api
    env_file:
      - ./.env
    command: >
      sh -c "cargo watch --workdir /app -w src -x 'run --bin class_management'"
    network_mode: host
    volumes:
      - .:/app
      - backend_cargo_registry:/usr/local/cargo/registry
      - backend_cargo_git:/usr/local/cargo/git
      - backend_target:/app/target
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    container_name: cedar-ui
    env_file:
      - ./.env
    network_mode: host
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  backend_cargo_registry:
  backend_cargo_git:
  backend_target:
  frontend_node_modules:
