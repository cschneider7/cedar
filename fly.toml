app = "seating-chart-app"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"
  build-target = "backend"

[env]
  RUST_LOG = "class_management=info,tower_http=info"

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  internal_port = 3000
  min_machines_running = 0
  force_https = true
  processes = [ "app" ]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
